name: 🎮 Galaga Contributions

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-galaga:
    name: Generate Galaga GIF
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🛎️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: pip install requests Pillow

      - name: 🎮 Generate Galaga GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: philippluca123
        run: python galaga_generator.py

      - name: 💾 Commit & Push GIF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Galaga Bot 🤖"
          git add galaga-contributions.gif
          git diff --staged --quiet || git commit -m "🎮 Update Galaga GIF [skip ci]"
          git push
